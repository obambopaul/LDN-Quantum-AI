<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum AI | Fix Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; }
        .btn-active { background: #10b981 !important; color: white !important; font-weight: 800; }
        .emerald-text { color: #10b981; }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center">

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black italic uppercase">Quantum<span class="text-emerald-500">.AI</span></h1>
            <div id="connection-status" class="bg-red-500/20 text-red-500 px-3 py-1 rounded-full text-[10px] font-black uppercase border border-red-500/20">Disconnected</div>
        </div>

        <!-- AI MONITOR -->
        <div class="glass p-8 mb-6 text-center shadow-2xl relative border-t border-emerald-500/20">
            <p id="bot-brain-text" class="text-emerald-500 text-[10px] font-black uppercase tracking-[0.3em] mb-4">Market Digit</p>
            <div id="ai-digit" class="text-9xl font-black text-white leading-none mb-4">-</div>
            
            <div class="flex justify-between mt-8 pt-6 border-t border-white/5">
                <div class="flex-1">
                    <p class="text-[8px] font-bold text-slate-500 uppercase">Balance</p>
                    <p id="balance" class="text-lg font-black text-emerald-500">$0.00</p>
                </div>
                <div class="flex-1 border-l border-white/5">
                    <p class="text-[8px] font-bold text-slate-500 uppercase">V-Losses</p>
                    <p id="v-count" class="text-lg font-black text-white">0</p>
                </div>
            </div>
        </div>

        <!-- Inputs -->
        <div class="glass p-6 space-y-4 shadow-xl">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800">
                    <label class="text-[8px] font-bold text-slate-500 uppercase block mb-1">Stake ($)</label>
                    <input type="number" id="stake" value="10" class="bg-transparent text-xl font-black text-white w-full outline-none" />
                </div>
                <div class="bg-slate-950/40 p-3 rounded-xl border border-slate-800">
                    <label class="text-[8px] font-bold text-slate-500 uppercase block mb-1">V-Limit</label>
                    <input type="number" id="vlimit" value="3" class="bg-transparent text-xl font-black text-white w-full outline-none" />
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[9px] font-bold text-slate-500 uppercase ml-1 tracking-widest">Secret API Token</label>
                <input type="text" id="token" placeholder="Paste Token (starts with a, b, c...)" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-emerald-400 font-mono text-xs focus:border-emerald-500 outline-none transition-all" />
            </div>
            
            <button onclick="startConnection()" id="main-btn" class="w-full bg-emerald-500 text-white py-5 rounded-3xl font-black text-lg shadow-xl shadow-emerald-500/20 active:scale-95 transition-all uppercase">
                Connect & Trade
            </button>
        </div>

        <!-- DEBUG LOGS -->
        <div id="logs" class="mt-4 bg-black/40 rounded-xl p-4 h-32 overflow-y-auto font-mono text-[9px] text-slate-500 space-y-1 border border-white/5">
            > App Ready. Enter token and click button.
        </div>
    </div>

    <script>
        let ws, vCount = 0, isRunning = false;
        let initialStake = 10, currentStake = 10;
        const APP_ID = "36542";

        function addLog(msg, color='text-slate-500') {
            const l = document.getElementById('logs');
            l.innerHTML = `<div class="${color}">> [${new Date().toLocaleTimeString()}] ${msg}</div>` + l.innerHTML;
        }

        function startConnection() {
            const token = document.getElementById('token').value.trim();
            
            if (!token) {
                alert("Please paste your API Token first.");
                return;
            }

            if (token.startsWith("VRTC") || token.startsWith("CR")) {
                alert("CRITICAL ERROR: You are pasting your Account ID. \n\nPlease go to Deriv Settings -> API Token and copy the SECRET TOKEN (the long random code).");
                return;
            }

            if (isRunning) {
                location.reload();
                return;
            }

            addLog("Opening London Pipe...");
            document.getElementById('main-btn').innerText = "Connecting...";

            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

            ws.onopen = () => {
                addLog("Pipe Open. Sending Token...");
                ws.send(JSON.stringify({ authorize: token }));
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);

                // Check for Server Errors
                if (data.error) {
                    addLog("ERROR: " + data.error.message, "text-red-500");
                    alert("Deriv Server Error: " + data.error.message);
                    document.getElementById('main-btn').innerText = "Connect & Trade";
                    return;
                }

                // Login Success
                if (data.msg_type === 'authorize') {
                    isRunning = true;
                    document.getElementById('connection-status').innerText = "Connected";
                    document.getElementById('connection-status').className = "bg-emerald-500/20 text-emerald-500 px-3 py-1 rounded-full text-[10px] font-black uppercase border border-emerald-500/20";
                    document.getElementById('balance').innerText = "$" + data.authorize.balance;
                    document.getElementById('main-btn').innerText = "STOP BOT";
                    document.getElementById('main-btn').classList.replace('bg-emerald-500', 'bg-red-600');
                    
                    addLog("IDENTITY VERIFIED. Balance: $" + data.authorize.balance, "text-emerald-500");
                    
                    // Subscribe to Ticks
                    ws.send(JSON.stringify({ ticks: "R_100", subscribe: 1 }));
                    ws.send(JSON.stringify({ proposal_open_contract: 1, subscribe: 1 }));
                }

                // Handle Market Digits
                if (data.tick) {
                    const d = parseInt(data.tick.quote.toString().slice(-1));
                    document.getElementById('ai-digit').innerText = d;
                    
                    // Strategy: Seven Bot (Simple check to see if it works)
                    if (d > 7) vCount = 0; else vCount++;
                    document.getElementById('v-count').innerText = vCount;

                    const limit = parseInt(document.getElementById('vlimit').value);
                    if (vCount >= limit && d === 7) {
                        addLog("ACCURACY TRIGGER HIT. Striking Over 7...", "text-white");
                        strike();
                    }
                }
            };

            ws.onerror = (err) => {
                addLog("WebSocket Connection Error. Check your internet.", "text-red-500");
                alert("Internet Error: Could not reach London server.");
            };
        }

        function strike() {
            const stakeVal = parseFloat(document.getElementById('stake').value);
            ws.send(JSON.stringify({
                buy: 1, price: stakeVal,
                parameters: { amount: stakeVal, basis: "stake", contract_type: "DIGITOVER", currency: "USD", duration: 1, duration_unit: "t", barrier: "7", symbol: "R_100" }
            }));
        }
    </script>
</body>
                        </html>
